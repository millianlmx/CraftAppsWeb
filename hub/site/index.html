<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craft Apps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Craft Apps</h1>
    <p>The ArtCraft suite, in the browser. Pick an app; each opens in a new tab and runs entirely on your machine.</p>
  </header>
  <main id="apps" aria-live="polite"></main>
  <footer>
    <span id="summary"></span>
    <a href="https://github.com/storytold">storytold on GitHub</a>
  </footer>
  <template id="card">
    <a class="card" target="_blank" rel="noopener">
      <span class="mark" aria-hidden="true"></span>
      <span class="text">
        <span class="name"></span>
        <span class="tagline"></span>
      </span>
      <span class="status" title=""></span>
    </a>
  </template>
  <script src="hub.js"></script>
</body>
</html>
