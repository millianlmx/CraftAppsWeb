name: Build and push images

# Every 3 hours (and on push / by hand): resolve each app's upstream ref to a commit and build its
# image only if the registry has no `sha-<commit>` tag yet. The registry is the only state, so
# nothing is tracked in this repo; a push that touches docker/ rebuilds every app, a push rebuilds
# the hub. Deployment is pull-based: Watchtower in the stack picks up the new `latest` images.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "Comma-separated app ids to build (empty = all from apps.json)"
        type: string
        default: ""
      source:
        description: "Upstream ref to build"
        type: choice
        options: [release, main]
        default: release
      force:
        description: "Rebuild even if the registry already has this commit"
        type: boolean
        default: false
      push:
        description: "Push to the registry"
        type: boolean
        default: true

env:
  # Override with repository variables REGISTRY / IMAGE_NAMESPACE; defaults to GHCR under this
  # repo's owner. Secrets REGISTRY_USERNAME / REGISTRY_PASSWORD replace GITHUB_TOKEN for
  # other registries.
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  detect:
    name: Detect updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      hub: ${{ steps.detect.outputs.hub }}
      push: ${{ steps.detect.outputs.push }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: python3 scripts/generate.py --check
      - name: Compose file is valid
        run: docker compose config --quiet

      # Read access is enough here; without it (private images on another registry, no
      # credentials) every tag looks missing and everything is rebuilt, which is the safe side.
      - uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Resolve upstream commits and compare with the registry
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.apps }}
          SOURCE: ${{ inputs.source || 'release' }}
          FORCE: ${{ inputs.force || 'false' }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          image_base="$REGISTRY/$IMAGE_NAMESPACE"
          exists() { docker manifest inspect "$1" >/dev/null 2>&1; }

          force=$FORCE
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- docker; then
              echo "docker/ changed in this push: rebuilding every app"
              force=true
            fi
          fi

          selected=$(jq -c --arg only "$ONLY" '
            [.apps[] | select($only == "" or (.id as $i | ($only | split(",") | map(gsub("^\\s+|\\s+$"; "")) | index($i)) != null))
             | {id, repo, ref: (.ref // "")}]' apps.json)
          test "$selected" != "[]" || { echo "no app matches '$ONLY'" >&2; exit 1; }

          matrix='[]'
          {
            echo "| App | Ref | Commit | Status |"
            echo "|-----|-----|--------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for row in $(echo "$selected" | jq -r '.[] | @base64'); do
            app=$(echo "$row" | base64 -d)
            id=$(echo "$app" | jq -r .id); repo=$(echo "$app" | jq -r .repo); ref=$(echo "$app" | jq -r .ref)
            if [ -z "$ref" ] && [ "$SOURCE" = release ]; then
              ref=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
            elif [ -z "$ref" ]; then
              ref=$(gh api "repos/$repo" --jq .default_branch)
            fi
            sha=$(gh api "repos/$repo/commits/$ref" --jq .sha)
            if [ "$force" != true ] && exists "$image_base/$id-web:sha-$sha"; then
              status="up to date"
            else
              status="**build**"
              matrix=$(echo "$matrix" | jq -c --arg id "$id" --arg repo "$repo" --arg ref "$ref" --arg sha "$sha" \
                '. + [{id: $id, repo: $repo, ref: $ref, sha: $sha}]')
            fi
            echo "$id: $repo@$ref ($sha) -> $status"
            echo "| $id | $ref | \`${sha:0:12}\` | $status |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$force" = true ] || ! exists "$image_base/craft-apps-hub:sha-$GITHUB_SHA"; then
            hub=true; status="**build**"
          else
            hub=false; status="up to date"
          fi
          echo "| hub | main | \`${GITHUB_SHA:0:12}\` | $status |" >> "$GITHUB_STEP_SUMMARY"

          {
            echo "matrix=$matrix"
            echo "hub=$hub"
            echo "push=${{ github.event_name != 'workflow_dispatch' || inputs.push }}"
          } >> "$GITHUB_OUTPUT"

  app:
    name: ${{ matrix.app.id }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.app.repo }}
          ref: ${{ matrix.app.sha }}
          path: src

      - name: Version and provenance
        id: meta
        run: |
          version=$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
                         in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' src/Cargo.toml)
          test -n "$version" || { echo "no [workspace.package] version in src/Cargo.toml" >&2; exit 1; }
          {
            echo "version=$version"
            echo "date=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"
          echo "building ${{ matrix.app.repo }} @ ${{ matrix.app.ref }} (${{ matrix.app.sha }}) = $version"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.detect.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: tags
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.id }}-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=sha-${{ matrix.app.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ matrix.app.repo }}
            org.opencontainers.image.revision=${{ matrix.app.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: src
          file: docker/app.Dockerfile
          build-contexts: cfg=docker
          platforms: ${{ env.PLATFORMS }}
          push: ${{ needs.detect.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            APP=${{ matrix.app.id }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_SHA=${{ matrix.app.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.app.id }}
          cache-to: type=gha,scope=${{ matrix.app.id }},mode=max

  hub:
    name: hub
    needs: detect
    if: needs.detect.outputs.hub == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.detect.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: tags
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/craft-apps-hub
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ needs.detect.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max
