name: Build and push images

on:
  push:
    branches: [main]
  schedule:
    # Weekly: pick up new upstream releases.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      apps:
        description: "Comma-separated app ids to build (empty = all from apps.json)"
        type: string
        default: ""
      source:
        description: "Upstream ref to build"
        type: choice
        options: [release, main]
        default: release
      push:
        description: "Push to the registry"
        type: boolean
        default: true

env:
  # Override with repository variables REGISTRY / IMAGE_NAMESPACE; defaults to GHCR under this
  # repo's owner. Secrets REGISTRY_USERNAME / REGISTRY_PASSWORD replace GITHUB_TOKEN for
  # other registries.
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  check:
    name: Generated files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      push: ${{ steps.matrix.outputs.push }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate.py --check
      - name: Compose file is valid
        run: HUB_HOST=example.test docker compose config --quiet
      - name: Build matrix
        id: matrix
        env:
          ONLY: ${{ inputs.apps }}
        run: |
          matrix=$(jq -c --arg only "$ONLY" '
            [.apps[] | select($only == "" or (.id as $i | ($only | split(",") | map(gsub("^\\s+|\\s+$"; "")) | index($i)) != null))
             | {id, web_dir}]' apps.json)
          test "$matrix" != "[]" || { echo "no app matches '$ONLY'" >&2; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name != 'workflow_dispatch' || inputs.push }}" >> "$GITHUB_OUTPUT"

  app:
    name: ${{ matrix.app.id }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJson(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: storytold/${{ matrix.app.id }}
          SOURCE: ${{ inputs.source || 'release' }}
        run: |
          if [ "$SOURCE" = release ]; then
            ref=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          else
            ref=$(gh api "repos/$REPO" --jq .default_branch)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "building $REPO @ $ref"

      - uses: actions/checkout@v4
        with:
          repository: storytold/${{ matrix.app.id }}
          ref: ${{ steps.ref.outputs.ref }}
          path: src

      - name: Version and provenance
        id: meta
        run: |
          version=$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
                         in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' src/Cargo.toml)
          test -n "$version" || { echo "no [workspace.package] version in src/Cargo.toml" >&2; exit 1; }
          {
            echo "version=$version"
            echo "sha=$(git -C src rev-parse HEAD)"
            echo "date=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.check.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: tags
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.id }}-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=sha-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/storytold/${{ matrix.app.id }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: src
          file: docker/app.Dockerfile
          build-contexts: cfg=docker
          platforms: ${{ env.PLATFORMS }}
          push: ${{ needs.check.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            APP=${{ matrix.app.id }}
            WEB_DIR=${{ matrix.app.web_dir }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_SHA=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.app.id }}
          cache-to: type=gha,scope=${{ matrix.app.id }},mode=max

  hub:
    name: hub
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.check.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: tags
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/craft-apps-hub
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ needs.check.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max
